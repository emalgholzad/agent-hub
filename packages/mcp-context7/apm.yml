name: mcp-context7
version: 1.0.0
description: Context7 documentation MCP server (set CONTEXT7_API_KEY in your environment)
includes: auto
dependencies:
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        Authorization: "Bearer ${CONTEXT7_API_KEY}"
